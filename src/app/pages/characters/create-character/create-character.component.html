<section class="mainCreate">
  <img src="images/Logo.svg" class="logo" />
  <div class="createCard">
    <h1>Create Your Character</h1>

    <div class="field">
      <label>Character's name</label>
      <input
        type="text"
        [(ngModel)]="characterName"
        placeholder=""
        [class.input-error]="error && !characterName"
      />
    </div>

    <div class="field">
      <label>Race</label>
      <div class="select-wrapper">
        <select [(ngModel)]="selectedRaceId" [class.input-error]="error && !selectedRaceId">
          <option value="" disabled selected>Not chosen</option>
          <option *ngFor="let race of races" [value]="race.id">
            {{ race.name }}
          </option>
        </select>
        <span class="select-arrow">&#x2713;</span>
      </div>
    </div>

    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <button class="btn-create" (click)="create()" [disabled]="loading">
      {{ loading ? 'Creating...' : 'Create' }}
    </button>
  </div>
</section>
