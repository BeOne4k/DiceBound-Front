<div class="tavern-wrapper">
  <div class="bg-overlay"></div>

  <!-- TOP -->
  <header class="top-bar">
    <div class="char-stats" (click)="goBackToCharacters()">
      <div class="stat-item">
        <span class="stat-label">{{ character?.name }}</span>
      </div>

      <div class="stat-divider"></div>

      <div class="stat-item">
        <span class="stat-label">Level: {{ character?.level }}</span>
      </div>

      <div class="stat-divider"></div>

      <div class="stat-item">
        <span class="stat-label">
          HP: {{ character?.hp ?? character?.HP ?? '?' }}
        </span>
      </div>

      <div class="stat-divider"></div>

      <div class="stat-item">
        <span class="stat-label">{{ character?.raceName }}</span>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="tavern-content">

    <!-- LEFT -->
    <aside class="sidebar">
      <div class="tavern-title">
        <span class="tavern-label">Tavern</span>
      </div>

      <div class="visitors-section">
        <p class="visitors-heading">Current visitors:</p>

        <ul class="visitors-list">
          <li *ngFor="let user of users" class="visitor-item">
            <span class="visitor-dot"></span>

            <span [class.visitor-me]="user === character?.name">
              {{ user }}
            </span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="back-btn" (click)="goHome()">
          <span class="back-icon">‹</span>
          <span class="back-label">Home Page</span>
        </button>
      </div>
    </aside>

    <!-- CHAT -->
    <section class="chat-panel">

      <div class="chat-messages" #chatBox>

        <div *ngFor="let msg of messages" class="chat-message">
          <span class="msg-author">{{ msg.user }}:</span>
          <span class="msg-text">{{ msg.text }}</span>
        </div>

        <div *ngIf="messages.length === 0" class="chat-empty">
          Tavern is empty... say something 
        </div>

      </div>

      <div class="chat-input-row">
        <input
          class="chat-input"
          [(ngModel)]="inputText"
          placeholder="Type message..."
          (keydown.enter)="sendMessage()"
          maxlength="300"
        />

        <button class="send-btn" (click)="sendMessage()">›</button>
      </div>

    </section>

  </main>
</div>
